version: '3.8'

services:
  aeromaint:
    build: .
    container_name: aeromaint
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/db/aeromaint.db
      - NODE_ENV=production
      - NEXTAUTH_SECRET=aeromaint-prod-secret-2024-change-me
      - NEXTAUTH_URL=http://localhost:3000
    volumes:
      - aeromaint-data:/app/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/auth/providers"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  aeromaint-data:
